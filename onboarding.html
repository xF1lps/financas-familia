<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
</head>
<body>

    <div class="tela-onboarding">
        <div class="cartao-onboarding">
            <span class="selo-marca">Finanças</span>
            <h1 class="titulo-onboarding">Só mais um passo</h1>
            <p class="texto-onboarding">Conta um pouco sobre você pra gente ajustar o app do seu jeito.</p>

            <div class="mensagem-aviso" id="mensagem-aviso"></div>

            <form id="formulario-onboarding">
                <div class="campo">
                    <label for="campo-nome">Nome</label>
                    <input type="text" id="campo-nome" placeholder="Seu nome" required>
                </div>

                <div class="campo">
                    <label for="campo-idade">Idade</label>
                    <input type="number" id="campo-idade" min="1" max="120" placeholder="Ex: 28" required>
                </div>

                <div class="campo">
                    <label>Profissão <span class="dica-campo">(pode marcar mais de uma)</span></label>
                    <div class="lista-checkbox" id="lista-profissoes">
                        <label class="item-checkbox"><input type="checkbox" value="Diarista"> Diarista</label>
                        <label class="item-checkbox"><input type="checkbox" value="CLT / Assalariado(a)"> CLT / Assalariado(a)</label>
                        <label class="item-checkbox"><input type="checkbox" value="Estudante"> Estudante</label>
                        <label class="item-checkbox"><input type="checkbox" value="Outros"> Outros</label>
                    </div>
                </div>

                <button type="submit" class="botao-enviar" id="botao-enviar">
                    <span class="texto-botao">Começar a usar</span>
                    <span class="spinner-botao" hidden></span>
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="onboarding.js"></script>
</body>
</html>
