<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Reaproveita as cores/fontes e os componentes de formulário já criados na tela de login -->
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
</head>
<body>

    <div class="app-shell">

        <!-- ========================================================== -->
        <!-- BARRA SUPERIOR: nome do app + e-mail de quem está logado + sair -->
        <!-- ========================================================== -->
        <header class="topo-app">
            <div class="marca-topo">
                <span class="ponto-marca"></span>
                Finanças
            </div>
            <div class="usuario-topo">
                <span class="email-usuario" id="email-usuario"></span>
                <button class="botao-sair" id="botao-sair">Sair</button>
            </div>
        </header>

        <main class="conteudo-principal">

            <!-- Só aparece pra quem marcou "Diarista" no onboarding, e só quando
                 ainda não registrou o ganho de hoje -->
            <section class="banner-diarista" id="banner-diarista" hidden>
                <div class="texto-banner-diarista">
                    <strong>Bora registrar o ganho de hoje?</strong>
                    <span>Como sua renda é diária, é bom já deixar anotado.</span>
                </div>
                <div class="acao-banner-diarista">
                    <div class="valor-wrapper">
                        <span class="prefixo-valor">R$</span>
                        <input type="number" id="valor-diario" step="0.01" min="0" placeholder="0,00">
                    </div>
                    <button type="button" class="botao-enviar" id="registrar-diario">Registrar</button>
                </div>
            </section>

            <!-- ========================================================== -->
            <!-- NAVEGAÇÃO ENTRE MESES -->
            <!-- ========================================================== -->
            <section class="navegacao-mes">
                <button class="seta-mes" id="mes-anterior" aria-label="Mês anterior">‹</button>
                <h2 class="rotulo-mes" id="rotulo-mes">—</h2>
                <button class="seta-mes" id="mes-proximo" aria-label="Próximo mês">›</button>
            </section>

            <!-- ========================================================== -->
            <!-- CARTÕES DE RESUMO: ganhos, gastos e saldo do mês selecionado -->
            <!-- ========================================================== -->
            <section class="cartoes-resumo">
                <div class="cartao-resumo cartao-ganho">
                    <span class="rotulo-cartao">Ganhos</span>
                    <span class="valor-cartao" id="total-ganhos">R$ 0,00</span>
                </div>
                <div class="cartao-resumo cartao-gasto">
                    <span class="rotulo-cartao">Gastos</span>
                    <span class="valor-cartao" id="total-gastos">R$ 0,00</span>
                </div>
                <div class="cartao-resumo cartao-saldo">
                    <span class="rotulo-cartao">Saldo</span>
                    <span class="valor-cartao" id="total-saldo">R$ 0,00</span>
                </div>
            </section>

            <!-- ========================================================== -->
            <!-- LISTA DE LANÇAMENTOS DO MÊS -->
            <!-- ========================================================== -->
            <section class="lista-lancamentos-secao">
                <h3 class="titulo-secao">Lançamentos</h3>
                <ul class="lista-lancamentos" id="lista-lancamentos"></ul>
                <p class="lista-vazia" id="lista-vazia" hidden>Nenhum lançamento neste mês ainda. Toca no + para adicionar o primeiro.</p>
            </section>

        </main>

        <!-- Botão flutuante fixo, sempre visível, pra adicionar um novo lançamento -->
        <button class="botao-adicionar" id="botao-abrir-modal" aria-label="Adicionar lançamento">+</button>

    </div>

    <!-- ========================================================== -->
    <!-- MODAL: formulário de novo lançamento (fica escondido até clicar no +) -->
    <!-- ========================================================== -->
    <div class="fundo-modal" id="fundo-modal">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3>Novo lançamento</h3>
                <button class="botao-fechar-modal" id="botao-fechar-modal" aria-label="Fechar">✕</button>
            </div>

            <!-- Alterna entre registrar um Gasto ou um Ganho -->
            <div class="abas-acesso">
                <button type="button" class="aba-botao ativa" id="tipo-gasto" data-tipo="gasto">Gasto</button>
                <button type="button" class="aba-botao" id="tipo-ganho" data-tipo="ganho">Ganho</button>
            </div>

            <form id="formulario-lancamento">
                <div class="campo">
                    <label for="campo-valor">Valor</label>
                    <div class="valor-wrapper">
                        <span class="prefixo-valor">R$</span>
                        <input type="number" id="campo-valor" step="0.01" min="0" placeholder="0,00" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="campo-categoria">Categoria</label>
                    <select id="campo-categoria" required></select>
                </div>

                <!-- Só aparece quando a pessoa escolhe "+ Nova categoria" no select acima -->
                <div class="campo" id="campo-nova-categoria-wrapper" hidden>
                    <label for="campo-nova-categoria">Nome da nova categoria</label>
                    <input type="text" id="campo-nova-categoria" placeholder="Ex: Pet, Academia...">
                </div>

                <div class="campo">
                    <label for="campo-descricao">Descrição (opcional)</label>
                    <input type="text" id="campo-descricao" placeholder="Ex: Mercado do mês">
                </div>

                <div class="campo">
                    <label for="campo-data">Data</label>
                    <input type="date" id="campo-data" required>
                </div>

                <div class="mensagem-aviso" id="mensagem-aviso-modal" role="alert"></div>

                <button type="submit" class="botao-enviar" id="botao-salvar-lancamento">
                    <span class="texto-botao">Salvar lançamento</span>
                    <span class="spinner-botao" hidden></span>
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
