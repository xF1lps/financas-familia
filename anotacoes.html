<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Anotações — Finanças</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="extrato.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="icon" href="favicon-16.png" sizes="16x16">
</head>
<body>

    <div class="app-shell">
        <header class="topo-app">
            <a href="dashboard.html" class="link-voltar" aria-label="Voltar">←</a>
            <div class="marca-topo">Anotações</div>
            <span style="width:40px"></span>
        </header>

        <main class="conteudo-principal">
            <p class="texto-explicativo-guardado">
                Contas que se repetem todo mês — só pra você lembrar o dia de vencer. Não manda aviso nenhum, é só uma lista de consulta.
            </p>

            <ul class="lista-lancamentos" id="lista-anotacoes"></ul>
            <p class="lista-vazia" id="anotacoes-vazio" hidden>Nenhuma anotação ainda.</p>

            <button type="button" class="botao-retirar" id="botao-abrir-nova-anotacao" style="margin-top:20px;">+ Adicionar conta</button>
        </main>
    </div>

    <div class="fundo-modal" id="fundo-modal-anotacao">
        <div class="modal-lancamento">
            <div class="cabecalho-modal">
                <h3>Nova anotação</h3>
                <button class="botao-fechar-modal" id="botao-fechar-anotacao" aria-label="Fechar">✕</button>
            </div>

            <div class="campo">
                <label for="campo-nome-conta">Nome da conta</label>
                <input type="text" id="campo-nome-conta" placeholder="Ex: Internet">
            </div>

            <div class="campo">
                <label for="campo-dia-vencimento">Dia do vencimento</label>
                <input type="number" id="campo-dia-vencimento" min="1" max="31" placeholder="Ex: 15">
            </div>

            <div class="mensagem-aviso" id="mensagem-aviso-anotacao" role="alert"></div>

            <button type="button" class="botao-enviar" id="botao-salvar-anotacao">
                <span class="texto-botao">Salvar anotação</span>
                <span class="spinner-botao" hidden></span>
            </button>
        </div>
    </div>

    <script type="module" src="anotacoes.js"></script>
</body>
</html>
